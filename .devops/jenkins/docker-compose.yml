services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: enterprise-jenkins

    ports:
      - "8080:8080"
      - "50000:50000"

    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

    group_add:
      - "989"

    restart: unless-stopped

    networks:
      - default
      - kind

volumes:
  jenkins_home:

networks:
  kind:
    external: true